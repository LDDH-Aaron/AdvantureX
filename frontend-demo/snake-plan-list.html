<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBCF4B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Snake" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/snake-180.png" />
<link rel="stylesheet" href="pwa.css" />
<title>SNAKE1 · 预案库 · RAFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FCF3D6; --sun:#FBCF4B; --pink:#FF6DAE; --pink2:#FF4E9A;
    --ink:#17140F; --card:#FFFEFA; --mut:#8A8475;
    --amber:#F5A623; --coral:#FF7A45; --red:#E7442E; --live:#3E9E5A;
    --disp:'Archivo Black','Noto Sans SC','PingFang SC',sans-serif;
    --ui:'Archivo','Noto Sans SC','PingFang SC','Noto Sans SC',sans-serif;
    --mono:'Space Mono',ui-monospace,'PingFang SC','Noto Sans SC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#2a2622;
    background-image:radial-gradient(circle at 1px 1px, rgba(251,207,75,.16) 1px, transparent 0);
    background-size:24px 24px;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:26px;font-family:var(--ui);overflow:hidden;
  }
  .phone{
    position:relative;width:390px;height:844px;flex:0 0 auto;
    background:var(--ink);border-radius:46px;padding:9px;
    box-shadow:0 0 0 2px #34302a, 0 30px 60px rgba(0,0,0,.6), 14px 14px 0 rgba(255,109,174,.32);
  }
  .screen{position:relative;width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;}

  .statusbar{height:46px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-family:var(--mono);font-weight:700;color:var(--ink);}
  .statusbar .time{font-size:15px;letter-spacing:.5px;}
  .statusbar .sys{display:flex;align-items:center;gap:7px;}
  .statusbar svg{display:block;}

  .app{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 0 74px;}
  .app::-webkit-scrollbar{display:none;}

  /* header band */
  .head{background:var(--sun);border-bottom:3px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:11px 18px 12px;}
  .logo{display:flex;align-items:center;gap:9px;}
  .logo .mark{width:26px;height:26px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);transform:rotate(-4deg);}
  .logo .wm{font-family:var(--disp);font-size:22px;letter-spacing:-1px;color:var(--ink);}
  .add-plan{margin:20px 18px 24px;height:60px;background:var(--pink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);text-decoration:none;font-size:16px;font-weight:900;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);}
  .add-plan:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink);}
  .add-plan .plus{font-family:var(--disp);font-size:23px;line-height:1;}
  .plan-section{padding:0 18px 18px;}
  .plan-section h2{font-size:14px;font-weight:900;margin-bottom:10px;}
  .plan-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--pink);color:var(--ink);text-decoration:none;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);}
  .plan-card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .plan-card .case{width:38px;height:38px;flex:0 0 auto;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);}
  .plan-card .body{flex:1;min-width:0;}
  .plan-card .body b{display:block;font-size:14px;font-weight:900;}
  .plan-card .body small{display:block;margin-top:5px;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--mut);}
  .plan-card .go{font-family:var(--disp);font-size:18px;}
  .head-r{display:flex;align-items:center;gap:8px;}
  .devs{display:flex;align-items:center;gap:6px;}
  .devchip{position:relative;width:34px;height:34px;flex:0 0 auto;background:var(--card);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .devchip .st{position:absolute;bottom:-3px;right:-3px;width:11px;height:11px;border:2px solid var(--ink);border-radius:50%;background:var(--live);}
  .devchip .st.on{animation:blink 1.4s steps(2,jump-none) infinite;}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.25}}
  .gear{width:36px;height:36px;flex:0 0 auto;background:var(--card);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);}
  .gear:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}

  /* hero (compact) */
  .hero{position:relative;padding:16px 20px 4px;}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .hl{font-family:var(--disp);font-weight:900;color:var(--ink);font-size:30px;line-height:1;letter-spacing:-1.2px;}
  .hl .p{color:var(--pink2);}
  .rec{font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.3px;color:var(--mut);text-decoration:none;flex:0 0 auto;}
  .rec:active{color:var(--ink);}
  .b{cursor:pointer;user-select:none;font-family:var(--ui);font-weight:800;font-size:14px;border:3px solid var(--ink);padding:12px 15px;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink);transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);}
  .b.pink{background:var(--pink);box-shadow:4px 4px 0 var(--ink);}
  .b.ghost{background:var(--card);box-shadow:4px 4px 0 var(--ink);}
  .b:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .b .arw{font-family:var(--disp);font-size:15px;}

  /* running strip */
  .runstrip{margin:6px 20px 0;cursor:pointer;background:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--coral);display:flex;align-items:center;gap:9px;padding:7px 11px;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);}
  .runstrip:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--coral);}
  .runstrip .pl{width:20px;height:20px;flex:0 0 auto;background:var(--coral);border:2px solid var(--coral);display:flex;align-items:center;justify-content:center;}
  .runstrip .rt{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;}
  .runstrip .rt b{font-family:var(--ui);font-weight:900;font-size:12px;color:var(--sun);line-height:1;}
  .runstrip .rt small{font-family:var(--mono);font-weight:700;font-size:8.5px;letter-spacing:.3px;color:var(--pink);}
  .runstrip .ld{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--coral);animation:blink 1s steps(2,jump-none) infinite;}

  /* filter chips */
  .filters{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;}
  .filters::-webkit-scrollbar{display:none;}
  .fc{flex:0 0 auto;cursor:pointer;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.4px;color:var(--ink);background:var(--card);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:6px 10px;transition:transform .06s steps(2,jump-none),box-shadow .06s steps(2,jump-none);}
  .fc.on{background:var(--pink);}
  .fc:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
  .fc .n{opacity:.55;margin-left:3px;}

  /* window list */
  .win{margin:8px 20px 6px;background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);}
  .win-top{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:3px solid var(--ink);}
  .ch{display:flex;align-items:center;gap:9px;font-family:var(--ui);font-weight:800;font-size:15px;color:var(--ink);}
  .ch .hash{width:24px;height:24px;flex:0 0 auto;background:var(--sun);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:14px;color:var(--ink);}
  .mem{font-family:var(--mono);font-weight:700;font-size:10px;color:var(--ink);border:2px solid var(--ink);padding:3px 7px;background:var(--cream);}
  .rows{padding:4px 0;}
  .row{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;cursor:pointer;border-left:4px solid transparent;border-bottom:2px dashed #eee2c2;transition:background .1s;}
  .row:last-child{border-bottom:0;}
  .row:active{background:#fff6df;}
  .av{width:34px;height:34px;flex:0 0 auto;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);overflow:hidden;}
  .av svg{width:100%;height:100%;display:block;}
  .av.r1{transform:rotate(-5deg);} .av.r2{transform:rotate(5deg);} .av.r3{transform:rotate(-3deg);}
  .rc{flex:1;min-width:0;}
  .rh{display:flex;align-items:center;gap:8px;}
  .rh b{font-family:var(--ui);font-weight:800;font-size:14px;color:var(--ink);}
  .tg{font-family:var(--mono);font-weight:700;font-size:8.5px;letter-spacing:.5px;color:var(--ink);border:1.5px solid var(--ink);padding:2px 6px;margin-left:auto;flex:0 0 auto;white-space:nowrap;}
  .tg.live{background:var(--live);color:#fff;}
  .tg.test{background:var(--amber);}
  .tg.draft{background:var(--cream);color:var(--mut);}
  .tg.dead{background:var(--red);color:#fff;}
  .rm{font-family:var(--ui);font-weight:500;font-size:12.5px;line-height:1.45;color:#3a352c;margin-top:4px;}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .mc{font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.2px;color:var(--ink);border:1.5px solid var(--ink);padding:2px 6px;background:var(--cream);display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .mc.warn{background:#FDE3DC;color:var(--red);border-color:var(--red);}
  .mc.ok{color:#256b3a;border-color:#256b3a;}
  .mc .sq{width:7px;height:7px;flex:0 0 auto;border:1px solid var(--ink);}

  .empty{display:none;padding:26px 20px;text-align:center;}
  .empty p{font-family:var(--ui);font-weight:600;font-size:13px;color:var(--mut);line-height:1.6;}
  .empty .clr{margin-top:12px;display:inline-block;font-family:var(--mono);font-weight:700;font-size:11px;color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:7px 12px;cursor:pointer;}

  .foot{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--mut);text-align:center;padding:14px 20px 4px;}

  .toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--sun);font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.5px;padding:11px 16px;border:3px solid var(--sun);opacity:0;pointer-events:none;z-index:20;white-space:nowrap;box-shadow:4px 4px 0 var(--pink);max-width:300px;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);transition:all .16s steps(3,jump-none);}

  /* tabbar */
  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:7;height:64px;display:flex;align-items:stretch;background:var(--card);border-top:3px solid var(--ink);}
  .tab{flex:1;position:relative;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#a49c88;border-right:2px solid #ece2c4;font-family:var(--mono);font-weight:700;font-size:9.5px;letter-spacing:1px;padding-bottom:3px;transition:transform .06s steps(2,jump-none);}
  .tab:last-child{border-right:0;}
  .tab .g{width:22px;height:22px;display:block;}
  .tab:active{transform:translateY(2px);}
  .tab.active{background:var(--sun);color:var(--ink);}
  .tab.active::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--pink);}
</style>
</head>
<body>
  <div class="phone"><div class="screen">

    <!-- pixel sprite defs -->

    </defs></svg>

    <!-- status bar -->
    <div class="statusbar">
      <div class="time">9:41</div>
      <div class="sys">
        <svg width="19" height="12" viewBox="0 0 19 12"><g fill="#17140F"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5.5" width="3" height="6.5"/><rect x="10" y="3" width="3" height="9"/><rect x="15" y="0.5" width="3" height="11.5"/></g></svg>

        <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3" fill="none" stroke="#17140F" stroke-width="1.4"/><rect x="2.4" y="2.4" width="15.5" height="8.2" rx="1.5" fill="#17140F"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#17140F"/></svg>

    <div class="app">

      <!-- header band -->

          <svg class="mark"><use href="#px-snake"/></svg>

    </div><!-- /app -->

  var exit=document.getElementById('exitPlan'),ice=document.getElementById('icebreakPlan');

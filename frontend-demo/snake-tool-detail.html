<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBCF4B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Snake" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/snake-180.png" />
<link rel="stylesheet" href="pwa.css?v=20260725-4" />
<title>Snake · 新增装备</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600;700;800;900&family=Space+Mono:wght@700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
:root{--cream:#FCF3D6;--sun:#FBCF4B;--pink:#FF6DAE;--ink:#17140F;--card:#FFFEFA;--mut:#8A8475;--disp:'Archivo Black','Noto Sans SC','PingFang SC',sans-serif;--ui:'Archivo','Noto Sans SC','PingFang SC',sans-serif;--mono:'Space Mono','PingFang SC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#2a2622;background-image:radial-gradient(circle at 1px 1px,rgba(251,207,75,.16) 1px,transparent 0);background-size:24px 24px;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:26px;font-family:var(--ui);overflow:hidden}.phone{width:390px;height:844px;flex:0 0 auto;background:var(--ink);border-radius:46px;padding:9px;box-shadow:0 0 0 2px #34302a,0 30px 60px rgba(0,0,0,.6),14px 14px 0 rgba(255,109,174,.32)}.screen{width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}.statusbar{height:46px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-family:var(--mono);font-size:15px}.sys{display:flex;align-items:center;gap:7px}.head{height:62px;flex:0 0 auto;background:var(--sun);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:12px;padding:10px 16px}.back{width:36px;height:36px;background:var(--card);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none}.head h1{font-family:var(--disp);font-size:20px;letter-spacing:-.5px}.body{flex:1;overflow-y:auto;padding:20px 18px 32px}.body::-webkit-scrollbar{display:none}.intro{margin-bottom:18px}.intro h2{font-family:var(--disp);font-size:26px;letter-spacing:-1px}.intro p{margin-top:7px;color:#5a5347;font-size:12px;font-weight:700}.form{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--pink);padding:16px 14px}.field{margin-bottom:16px}.field:last-of-type{margin-bottom:0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.control{width:100%;height:48px;border:2.5px solid var(--ink);background:var(--cream);padding:0 12px;color:var(--ink);font:800 14px var(--ui);outline:none;border-radius:0}.control:focus{box-shadow:3px 3px 0 var(--sun)}select.control{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 11px) 20px;background-size:6px 6px,6px 6px;background-repeat:no-repeat}.save{display:flex;width:100%;height:56px;margin-top:22px;align-items:center;justify-content:center;background:var(--pink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);color:var(--ink);font:900 16px var(--ui);cursor:pointer}.save:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}.delete{display:none;width:100%;margin-top:17px;border:0;background:transparent;color:#8A3D3D;font:800 12px var(--ui);text-decoration:underline;cursor:pointer}.editing .delete{display:block}.hint{font:700 9px var(--mono);color:var(--mut);margin-top:7px;line-height:1.5}
</style>
</head>
<body><div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="sys"><svg width="19" height="12" viewBox="0 0 19 12"><g fill="#17140F"><rect y="8" width="3" height="4"/><rect x="5" y="5.5" width="3" height="6.5"/><rect x="10" y="3" width="3" height="9"/><rect x="15" y=".5" width="3" height="11.5"/></g></svg><svg width="17" height="12" viewBox="0 0 17 12"><path fill="#17140F" d="M8.5 2.2c2.9 0 5.6 1.1 7.6 3l-1.5 1.6A8.6 8.6 0 0 0 2.4 6.8L.9 5.2a11 11 0 0 1 7.6-3zm0 3.9c1.7 0 3.3.7 4.5 1.9l-1.6 1.6a4.1 4.1 0 0 0-5.8 0L4 8a6.4 6.4 0 0 1 4.5-1.9zm0 2.7a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2z"/></svg><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3" fill="none" stroke="#17140F" stroke-width="1.4"/><rect x="2.4" y="2.4" width="15.5" height="8.2" rx="1.5" fill="#17140F"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#17140F"/></svg></span></div>
  <header class="head"><a class="back" href="snake-tool-config.html" aria-label="返回"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="m15 5-7 7 7 7"/></svg></a><h1 id="pageTitle">新增装备</h1></header>
  <main class="body">
    <div class="intro"><h2 id="formTitle">添加一件装备</h2><p>授权给 Snake，在需要时调用</p></div>
    <form class="form" id="toolForm">
      <div class="field"><label for="toolType">装备类型</label><select class="control" id="toolType" name="toolType" required><option value="">请选择类型</option><option>电话</option><option value="机器狗">机械狗</option><option>耳机</option></select></div>
      <div class="field"><label for="toolName">装备名称</label><input class="control" id="toolName" name="toolName" placeholder="例如：我的电话" required /></div>
      <div class="field"><label for="connection">连接方式</label><select class="control" id="connection" name="connection" required><option value="">请选择连接方式</option><option>本机授权</option><option>蓝牙连接</option><option>局域网连接</option></select></div>
      <div class="field"><label for="ability">允许 Snake 使用</label><select class="control" id="ability" name="ability" required><option value="">请选择能力</option><option>拨打救急来电</option><option>示好并展示联系方式</option><option>播放语音提示</option></select><div class="hint">Snake 只会获得你在这里选择的能力</div></div>
      <button class="save" type="submit" id="saveBtn">添加装备</button>
    </form>
    <button class="delete" id="deleteBtn" type="button">移除这件装备</button>
  </main>
</div></div>
<script>
(function(){
  var mode=new URLSearchParams(location.search).get('mode'),editing=mode==='edit'||mode==='dog';
  if(editing){document.body.classList.add('editing');document.title='Snake · 编辑装备';document.getElementById('pageTitle').textContent='编辑装备';document.getElementById('saveBtn').textContent='保存修改';if(mode==='dog'){document.getElementById('formTitle').textContent='机器狗';document.getElementById('toolType').value='机器狗';document.getElementById('toolName').value='机器狗';document.getElementById('connection').value='局域网连接';document.getElementById('ability').value='示好并展示联系方式'}else{document.getElementById('formTitle').textContent='电话';document.getElementById('toolType').value='电话';document.getElementById('toolName').value='电话';document.getElementById('connection').value='本机授权';document.getElementById('ability').value='拨打救急来电'}}
  var type=document.getElementById('toolType'),name=document.getElementById('toolName'),connection=document.getElementById('connection'),ability=document.getElementById('ability');
  type.addEventListener('change',function(){
    if(type.value==='机器狗'){name.value='机械狗';connection.value='局域网连接';ability.value='示好并展示联系方式';}
    if(type.value==='电话'){name.value='电话';connection.value='本机授权';ability.value='拨打救急来电';}
    if(type.value==='耳机'){name.value='我的耳机';connection.value='蓝牙连接';ability.value='播放语音提示';}
  });
  document.getElementById('toolForm').addEventListener('submit',function(e){
    e.preventDefault();
    if(type.value==='机器狗'){
      localStorage.setItem('snake_dog_added','1');
      localStorage.setItem('snake_dog_name',name.value.trim()||'机械狗');
      location.href='snake-tool-config.html?added=dog';return;
    }
    location.href='snake-tool-config.html?updated=1';
  });
  document.getElementById('deleteBtn').addEventListener('click',function(){
    if(mode==='dog'){localStorage.removeItem('snake_dog_added');localStorage.removeItem('snake_dog_name');}
    location.href='snake-tool-config.html?removed=1';
  });
})();
</script>
</body></html>

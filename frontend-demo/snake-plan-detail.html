<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBCF4B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Snake" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/snake-180.png" />
<link rel="stylesheet" href="pwa.css" />
<title>Snake · 预案详情</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FCF3D6; --sun:#FBCF4B; --pink:#FF6DAE; --pink2:#FF4E9A;
    --ink:#17140F; --card:#FFFEFA; --mut:#8A8475;
    --amber:#F5A623; --coral:#FF7A45; --red:#E7442E; --live:#3E9E5A;
    --disp:'Archivo Black','Noto Sans SC','PingFang SC',sans-serif;
    --ui:'Archivo','Noto Sans SC','PingFang SC','Noto Sans SC',sans-serif;
    --mono:'Space Mono',ui-monospace,'PingFang SC','Noto Sans SC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#2a2622;
    background-image:radial-gradient(circle at 1px 1px, rgba(251,207,75,.16) 1px, transparent 0);
    background-size:24px 24px;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:26px;font-family:var(--ui);overflow:hidden;
  }
  .phone{
    position:relative;width:390px;height:844px;flex:0 0 auto;
    background:var(--ink);border-radius:46px;padding:9px;
    box-shadow:0 0 0 2px #34302a, 0 30px 60px rgba(0,0,0,.6), 14px 14px 0 rgba(255,109,174,.32);
  }
  .screen{position:relative;width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;}

  .statusbar{height:46px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-family:var(--mono);font-weight:700;color:var(--ink);}
  .statusbar .time{font-size:15px;letter-spacing:.5px;}
  .statusbar .sys{display:flex;align-items:center;gap:7px;}
  .statusbar svg{display:block;}

  .app{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 0 24px;}
  .app::-webkit-scrollbar{display:none;}

  /* top bar with back */
  .head{background:var(--sun);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:11px;padding:11px 16px 12px;}
  .back{width:36px;height:36px;flex:0 0 auto;background:var(--card);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);}
  .back:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
  .htitle{font-family:var(--disp);font-size:19px;letter-spacing:-.5px;color:var(--ink);}
  .head-sp{flex:1;}
  .tg{font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.5px;color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:4px 7px;white-space:nowrap;}
  .tg.live{background:var(--live);color:#fff;}

  /* summary hero */
  .sum{margin:14px 18px 0;background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px;}
  .sum .row1{display:flex;align-items:center;gap:11px;}
  .sum .av{width:52px;height:52px;flex:0 0 auto;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:var(--pink);image-rendering:pixelated;object-fit:cover;}
  .sum .nm{font-family:var(--disp);font-size:22px;letter-spacing:-.6px;color:var(--ink);line-height:1;}
  .sum .mo{font-family:var(--ui);font-weight:600;font-size:12.5px;line-height:1.45;color:#3a352c;margin-top:11px;background:var(--cream);border:2px dashed #e2d3a0;padding:9px 10px;}
  .sum .facts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .fact{font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.3px;color:var(--ink);border:1.5px solid var(--ink);background:var(--cream);padding:3px 7px;display:flex;align-items:center;gap:4px;}
  .fact .sq{width:7px;height:7px;border:1px solid var(--ink);}
  .fact.ok{color:#256b3a;border-color:#256b3a;}
  .skill-kicker{font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:1.2px;color:var(--pink2);margin-bottom:7px;}
  .loop{margin:16px 18px 0;}
  .loop h2{font-size:14px;font-weight:900;margin-bottom:10px;}
  .loop-card{background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--pink);padding:4px 12px;}
  .loop-row{display:flex;gap:11px;padding:13px 0;border-bottom:2px dashed #eee2c2;}
  .loop-row:last-child{border-bottom:0;}
  .loop-no{width:26px;height:26px;flex:0 0 auto;background:var(--ink);color:var(--sun);font-family:var(--disp);font-size:12px;display:flex;align-items:center;justify-content:center;}
  .loop-copy{flex:1;min-width:0;}
  .loop-copy b{display:block;font-size:13px;font-weight:900;}
  .loop-copy small{display:block;margin-top:4px;font-size:11px;font-weight:600;line-height:1.45;color:#5a5347;}
  .loop-tag{flex:0 0 auto;align-self:flex-start;font-family:var(--mono);font-weight:700;font-size:8px;border:1.5px solid var(--ink);background:var(--cream);padding:3px 5px;}

  /* section block */
  .sec{margin:16px 18px 0;}
  .sec-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .sec-h .hash{width:22px;height:22px;flex:0 0 auto;background:var(--sun);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:12px;color:var(--ink);}
  .sec-h b{font-family:var(--ui);font-weight:900;font-size:14px;color:var(--ink);}
  .sec-h .hint{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:9px;color:var(--mut);}

  .card{background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);}
  /* signal dependency */
  .dep{display:flex;align-items:center;gap:11px;padding:12px;}
  .dep .ic{width:40px;height:40px;flex:0 0 auto;background:var(--pink);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .dep .dt{flex:1;min-width:0;}
  .dep .dt b{font-family:var(--ui);font-weight:800;font-size:14px;color:var(--ink);display:block;}
  .dep .dt small{font-family:var(--mono);font-weight:700;font-size:10px;color:var(--mut);}
  .onair{font-family:var(--mono);font-weight:700;font-size:9px;color:#256b3a;border:1.5px solid #256b3a;padding:3px 6px;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .onair .d{width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.1s steps(2,jump-none) infinite;}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.2}}

  /* equipment steps */
  .steps{padding:6px 0;}
  .step{display:flex;gap:11px;padding:11px 12px;border-bottom:2px dashed #eee2c2;}
  .step:last-child{border-bottom:0;}
  .step .no{width:26px;height:26px;flex:0 0 auto;background:var(--ink);color:var(--sun);border:2px solid var(--ink);font-family:var(--disp);font-size:13px;display:flex;align-items:center;justify-content:center;}
  .step .sc{flex:1;min-width:0;}
  .step .st-t{display:flex;align-items:center;gap:7px;}
  .step .st-t b{font-family:var(--ui);font-weight:800;font-size:13.5px;color:var(--ink);}
  .chipk{font-family:var(--mono);font-weight:700;font-size:8.5px;letter-spacing:.3px;color:var(--ink);border:1.5px solid var(--ink);background:var(--sun);padding:2px 6px;margin-left:auto;white-space:nowrap;}
  .step .st-d{font-family:var(--ui);font-weight:500;font-size:12px;line-height:1.5;color:#3a352c;margin-top:5px;}
  .kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .kv .k{font-family:var(--mono);font-weight:700;font-size:9px;color:var(--ink);border:1.5px solid var(--ink);background:var(--cream);padding:2px 6px;}
  .kv .k i{font-style:normal;color:var(--pink2);}

  /* snake judge callout */
  .judge{padding:12px;}
  .judge .jt{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .judge .jt img{width:26px;height:26px;border:2px solid var(--ink);image-rendering:pixelated;}
  .judge .jt b{font-family:var(--ui);font-weight:900;font-size:13px;color:var(--ink);}
  .judge p{font-family:var(--ui);font-weight:500;font-size:12.5px;line-height:1.55;color:#3a352c;}
  .judge .li{display:flex;gap:7px;margin-top:7px;font-family:var(--ui);font-weight:600;font-size:12px;color:#3a352c;}
  .judge .li .b{color:var(--pink2);font-weight:900;flex:0 0 auto;}

  /* recent run mini */
  .recent{display:flex;align-items:center;gap:10px;padding:11px 12px;}
  .recent .ic{width:34px;height:34px;flex:0 0 auto;background:var(--live);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;}
  .recent .rt{flex:1;min-width:0;}
  .recent .rt b{font-family:var(--ui);font-weight:800;font-size:13px;color:var(--ink);display:block;}
  .recent .rt small{font-family:var(--mono);font-weight:700;font-size:9.5px;color:var(--mut);}
  .recent .go{font-family:var(--disp);font-size:15px;color:var(--ink);}

  /* bottom action dock */
  .dock{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:3px solid var(--ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;}
  .b{cursor:pointer;user-select:none;font-family:var(--ui);font-weight:800;font-size:14px;border:3px solid var(--ink);padding:13px 14px;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink);transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);white-space:nowrap;}
  .b.pink{background:var(--pink);box-shadow:4px 4px 0 var(--ink);flex:1;}
  .b.ghost{background:var(--card);box-shadow:4px 4px 0 var(--ink);}
  .b:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .b .arw{font-family:var(--disp);font-size:15px;}

  /* confirm sheet */
  .mask{position:absolute;inset:0;z-index:30;background:rgba(23,20,15,.55);display:none;align-items:flex-end;}
  .mask.show{display:flex;}
  .sheet{width:100%;background:var(--card);border-top:3px solid var(--ink);box-shadow:0 -8px 0 rgba(255,109,174,.3);padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .18s steps(4,jump-none);}
  .mask.show .sheet{transform:translateY(0);}
  .sheet .sh-ic{width:46px;height:46px;background:var(--coral);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);margin-bottom:12px;}
  .sheet h3{font-family:var(--disp);font-size:20px;letter-spacing:-.5px;color:var(--ink);}
  .sheet p{font-family:var(--ui);font-weight:600;font-size:13px;line-height:1.55;color:#3a352c;margin-top:8px;}
  .sheet .warnbox{margin-top:11px;background:#FDE3DC;border:2px solid var(--red);padding:9px 10px;font-family:var(--mono);font-weight:700;font-size:10px;color:var(--red);line-height:1.5;}
  .sheet .acts{display:flex;gap:10px;margin-top:16px;}

  .toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,20px);background:var(--ink);color:var(--sun);font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.5px;padding:11px 16px;border:3px solid var(--sun);opacity:0;pointer-events:none;z-index:40;white-space:nowrap;box-shadow:4px 4px 0 var(--pink);max-width:300px;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);transition:all .16s steps(3,jump-none);}
</style>
</head>
<body>
  <div class="phone"><div class="screen">

    <div class="statusbar">
      <div class="time">9:41</div>
      <div class="sys">
        <svg width="19" height="12" viewBox="0 0 19 12"><g fill="#17140F"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5.5" width="3" height="6.5"/><rect x="10" y="3" width="3" height="9"/><rect x="15" y="0.5" width="3" height="11.5"/></g></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><g fill="#17140F"><path d="M8.5 2.2c2.9 0 5.6 1.1 7.6 3l-1.5 1.6A8.6 8.6 0 0 0 8.5 4.3 8.6 8.6 0 0 0 2.4 6.8L.9 5.2A11 11 0 0 1 8.5 2.2z"/><path d="M8.5 6.1c1.7 0 3.3.7 4.5 1.9l-1.6 1.6a4.1 4.1 0 0 0-5.8 0L4 8a6.4 6.4 0 0 1 4.5-1.9z"/><circle cx="8.5" cy="10.4" r="1.6"/></g></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3" fill="none" stroke="#17140F" stroke-width="1.4"/><rect x="2.4" y="2.4" width="15.5" height="8.2" rx="1.5" fill="#17140F"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#17140F"/></svg>
      </div>
    </div>

    <div class="app">

      <div class="head">
        <a class="back" href="snake-plan-list.html" aria-label="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17140F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <span class="htitle">预案</span>
        <span class="head-sp"></span>
        <span class="tg live">已启用</span>
      </div>

      <!-- Skill summary -->
      <div class="sum">
        <div class="skill-kicker">SKILL</div>
        <div class="nm" id="skillName">体面离场</div>
        <div class="mo" id="skillDesc">收到暗号后，用一通救急来电帮你自然离场。</div>
        <div class="facts" id="skillFacts">
          <span class="fact"><span class="sq" style="background:var(--pink)"></span>暗号 Ring01 双击</span>
          <span class="fact"><span class="sq" style="background:var(--sun)"></span>装备 电话</span>
        </div>
      </div>

      <section class="loop">
        <h2>Loop</h2>
        <div class="loop-card" id="loopCard">
          <div class="loop-row"><span class="loop-no">1</span><span class="loop-copy"><b>收到暗号</b><small>双击 Ring 01</small></span><span class="loop-tag">WHEN</span></div>
          <div class="loop-row"><span class="loop-no">2</span><span class="loop-copy"><b>确认场景</b><small>判断当前是否在饭局或相亲中</small></span><span class="loop-tag">CHECK</span></div>
          <div class="loop-row"><span class="loop-no">3</span><span class="loop-copy"><b>等待 3 秒</b><small>保留取消时间</small></span><span class="loop-tag">WAIT</span></div>
          <div class="loop-row"><span class="loop-no">4</span><span class="loop-copy"><b>拨打救急来电</b><small>通过电话装备，以「妈妈」来电</small></span><span class="loop-tag">DO</span></div>
        </div>
      </section>

      <section class="sec">
        <div class="sec-h"><span class="hash">T</span><b>测试预案</b><span class="hint">可选</span></div>
        <div class="card" style="padding:12px">
          <button id="testSkillBtn" type="button" style="width:100%;height:46px;background:var(--sun);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:800 13px var(--ui);color:var(--ink)">手动测试</button>
          <div id="testSkillResult" style="display:none;margin-top:10px;padding:9px;border:2px dashed var(--ink);font:700 10px var(--mono);color:#256b3a">✓ 预案结构检查通过 · 未执行真实动作</div>
        </div>
      </section>

    </div><!-- /app -->

  </div></div>
<script>
(function(){
  var skill=new URLSearchParams(location.search).get('skill')||'exit';
  if(skill==='icebreak'){
    document.getElementById('skillName').textContent='社交破冰';
    document.getElementById('skillDesc').textContent='让机器狗替你迈出社交第一步，并自然展示联系方式。';
    document.getElementById('skillFacts').innerHTML='<span class="fact"><span class="sq" style="background:var(--pink)"></span>暗号 Ring 01 三击</span><span class="fact"><span class="sq" style="background:var(--sun)"></span>装备 机器狗</span>';
    document.getElementById('loopCard').innerHTML='<div class="loop-row"><span class="loop-no">1</span><span class="loop-copy"><b>收到暗号</b><small>连续敲击 Ring 01 三次</small></span><span class="loop-tag">WHEN</span></div><div class="loop-row"><span class="loop-no">2</span><span class="loop-copy"><b>确认距离</b><small>目标在机器狗可接近范围</small></span><span class="loop-tag">CHECK</span></div><div class="loop-row"><span class="loop-no">3</span><span class="loop-copy"><b>友好靠近</b><small>摇尾并做示好动作</small></span><span class="loop-tag">DO</span></div><div class="loop-row"><span class="loop-no">4</span><span class="loop-copy"><b>展示信息</b><small>屏幕展示你的联系方式</small></span><span class="loop-tag">DO</span></div><div class="loop-row"><span class="loop-no">5</span><span class="loop-copy"><b>回到身边</b><small>完成后返回用户位置</small></span><span class="loop-tag">END</span></div>';
  }else{
    document.getElementById('loopCard').innerHTML='<div class="loop-row"><span class="loop-no">1</span><span class="loop-copy"><b>收到暗号</b><small>双击 Ring 01</small></span><span class="loop-tag">WHEN</span></div><div class="loop-row"><span class="loop-no">2</span><span class="loop-copy"><b>识别时机</b><small>确认处于社交场景</small></span><span class="loop-tag">CHECK</span></div><div class="loop-row"><span class="loop-no">3</span><span class="loop-copy"><b>拨打电话</b><small>来电身份显示为「妈妈」</small></span><span class="loop-tag">DO</span></div><div class="loop-row"><span class="loop-no">4</span><span class="loop-copy"><b>播报理由</b><small>家里有急事，让你马上回去</small></span><span class="loop-tag">SAY</span></div><div class="loop-row"><span class="loop-no">5</span><span class="loop-copy"><b>确认结果</b><small>未接听则 20 秒后重试一次</small></span><span class="loop-tag">LOOP</span></div>';
  }
  document.getElementById('testSkillBtn').addEventListener('click',function(){
    this.textContent='正在检查 Loop…';this.disabled=true;
    var btn=this,res=document.getElementById('testSkillResult');
    setTimeout(function(){btn.textContent='重新测试';btn.disabled=false;res.style.display='block';},900);
  });
})();
</script>
</body>
</html>

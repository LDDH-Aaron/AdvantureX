<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBCF4B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Snake" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/snake-180.png" />
<link rel="stylesheet" href="pwa.css?v=20260725-4" />
<title>SNAKE1 · 暗号</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FCF3D6; --sun:#FBCF4B; --pink:#FF6DAE; --pink2:#FF4E9A;
    --ink:#17140F; --card:#FFFEFA; --mut:#8A8475;
    --amber:#F5A623; --coral:#FF7A45; --red:#E7442E; --live:#3E9E5A;
    --disp:'Archivo Black','Noto Sans SC','PingFang SC',sans-serif;
    --ui:'Archivo','Noto Sans SC','PingFang SC','Noto Sans SC',sans-serif;
    --mono:'Space Mono',ui-monospace,'PingFang SC','Noto Sans SC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#2a2622;
    background-image:radial-gradient(circle at 1px 1px, rgba(251,207,75,.16) 1px, transparent 0);
    background-size:24px 24px;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:26px;font-family:var(--ui);overflow:hidden;
  }
  .phone{
    position:relative;width:390px;height:844px;flex:0 0 auto;
    background:var(--ink);border-radius:46px;padding:9px;
    box-shadow:0 0 0 2px #34302a, 0 30px 60px rgba(0,0,0,.6), 14px 14px 0 rgba(255,109,174,.32);
  }
  .screen{position:relative;width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;}

  .statusbar{height:46px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-family:var(--mono);font-weight:700;color:var(--ink);}
  .statusbar .time{font-size:15px;letter-spacing:.5px;}
  .statusbar .sys{display:flex;align-items:center;gap:7px;}
  .statusbar svg{display:block;}

  .app{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 0 74px;}
  .app::-webkit-scrollbar{display:none;}

  .head{background:var(--sun);border-bottom:3px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:11px 18px 12px;}
  .logo{display:flex;align-items:center;gap:9px;}
  .logo .mark{width:26px;height:26px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);transform:rotate(-4deg);}
  .logo .wm{font-family:var(--disp);font-size:22px;letter-spacing:-1px;color:var(--ink);}
  .add-item{margin:20px 18px 24px;height:60px;background:var(--pink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);text-decoration:none;font-size:16px;font-weight:900;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);}
  .add-item:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink);}
  .add-item .plus{font-family:var(--disp);font-size:23px;line-height:1;}
  .simple-section{padding:0 18px 18px;}
  .simple-section h2{font-size:14px;font-weight:900;margin-bottom:10px;}
  .simple-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--pink);color:var(--ink);text-decoration:none;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);}
  .simple-card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink);}
  .simple-card .simple-icon{width:40px;height:40px;flex:0 0 auto;background:var(--pink);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;}
  .simple-card .simple-copy{flex:1;min-width:0;}
  .simple-card .simple-copy b{display:block;font-size:14px;font-weight:900;}
  .simple-card .simple-copy small{display:block;margin-top:5px;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--mut);}
  .simple-card .arrow{font-family:var(--disp);font-size:22px;}
  .simple-card.just-added{animation:added-pop .55s steps(4,jump-none);}
  @keyframes added-pop{0%{transform:scale(.92);background:var(--sun)}55%{transform:scale(1.03);background:var(--pink)}100%{transform:none;background:var(--card)}}
  .saved-note{display:none;margin:0 18px 16px;padding:9px 11px;background:var(--ink);color:var(--sun);border:2px solid var(--ink);font-family:var(--mono);font-size:10px;font-weight:700;text-align:center;}
  .st-pill{display:flex;align-items:center;gap:7px;background:var(--pink);color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:var(--ui);font-weight:800;font-size:12.5px;letter-spacing:.3px;padding:6px 11px;}
  .st-pill .dot{width:7px;height:7px;background:var(--ink);border-radius:50%;animation:blink 1.1s steps(2,jump-none) infinite;}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.2}}

  .hero{padding:16px 20px 4px;}
  .kicker{display:inline-block;font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:2px;color:var(--ink);background:var(--card);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:4px 9px;margin-bottom:11px;text-transform:uppercase;}
  .hl{font-family:var(--disp);font-weight:900;color:var(--ink);font-size:32px;line-height:1;letter-spacing:-1px;}
  .hl .p{color:var(--pink2);}
  .hsub{font-family:var(--ui);font-weight:600;font-size:12.5px;color:#4a463c;margin-top:8px;line-height:1.5;}

  .sec{margin:16px 20px 0;}
  .sec-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .sec-h .hash{width:22px;height:22px;flex:0 0 auto;background:var(--sun);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:12px;color:var(--ink);}
  .sec-h b{font-family:var(--ui);font-weight:900;font-size:14px;color:var(--ink);}
  .sec-h .n{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:10px;color:var(--mut);}

  .win{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);}
  .row{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;cursor:pointer;border-bottom:2px dashed #eee2c2;transition:background .1s;}
  .row:last-child{border-bottom:0;}
  .row:active{background:#fff6df;}
  .ic{width:40px;height:40px;flex:0 0 auto;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .ic.p{background:var(--pink);} .ic.y{background:var(--sun);} .ic.c{background:var(--cream);}
  .rc{flex:1;min-width:0;}
  .rh{display:flex;align-items:center;gap:8px;}
  .rh b{font-family:var(--ui);font-weight:800;font-size:14px;color:var(--ink);}
  .onair{font-family:var(--mono);font-weight:700;font-size:8.5px;color:#256b3a;border:1.5px solid #256b3a;padding:2px 6px;margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .onair .d{width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.1s steps(2,jump-none) infinite;}
  .offair{font-family:var(--mono);font-weight:700;font-size:8.5px;color:var(--mut);border:1.5px solid var(--mut);padding:2px 6px;margin-left:auto;flex:0 0 auto;white-space:nowrap;}
  .rm{font-family:var(--ui);font-weight:500;font-size:12px;line-height:1.45;color:#3a352c;margin-top:4px;}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .mc{font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.2px;color:var(--ink);border:1.5px solid var(--ink);padding:2px 6px;background:var(--cream);display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .mc .sq{width:7px;height:7px;flex:0 0 auto;border:1px solid var(--ink);}
  .mc.warn{background:#FDE3DC;color:var(--red);border-color:var(--red);}
  .mc.bind{background:var(--pink);}

  /* machine catalog grid */
  .cat{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .mch{background:var(--card);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 11px;cursor:pointer;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none);}
  .mch:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .mch .top{display:flex;align-items:center;justify-content:space-between;}
  .mch .mi{width:38px;height:38px;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .mch .mi.p{background:var(--pink);} .mch .mi.y{background:var(--sun);} .mch .mi.c{background:var(--cream);} .mch .mi.co{background:var(--coral);}
  .stt{font-family:var(--mono);font-weight:700;font-size:8px;letter-spacing:.4px;padding:2px 6px;border:1.5px solid var(--ink);white-space:nowrap;}
  .stt.ok{background:var(--live);color:#fff;}
  .stt.beta{background:var(--sun);}
  .stt.soon{background:var(--cream);color:var(--mut);}
  .mch h4{font-family:var(--ui);font-weight:800;font-size:14px;color:var(--ink);margin-top:10px;}
  .mch small{display:block;font-family:var(--ui);font-weight:500;font-size:10.5px;color:#5a5347;margin-top:3px;line-height:1.4;}

  .foot{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--mut);text-align:center;padding:16px 20px 4px;}

  .toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--sun);font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.5px;padding:11px 16px;border:3px solid var(--sun);opacity:0;pointer-events:none;z-index:20;white-space:nowrap;box-shadow:4px 4px 0 var(--pink);max-width:310px;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);transition:all .16s steps(3,jump-none);}

  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:7;height:64px;display:flex;align-items:stretch;background:var(--card);border-top:3px solid var(--ink);}
  .tab{flex:1;position:relative;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#a49c88;border-right:2px solid #ece2c4;font-family:var(--mono);font-weight:700;font-size:9.5px;letter-spacing:1px;padding-bottom:3px;transition:transform .06s steps(2,jump-none);}
  .tab:last-child{border-right:0;}
  .tab .g{width:22px;height:22px;display:block;}
  .tab:active{transform:translateY(2px);}
  .tab.active{background:var(--sun);color:var(--ink);}
  .tab.active::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--pink);}
</style>
</head>
<body>
  <div class="phone"><div class="screen">

    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <symbol id="px-snake" viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect width="8" height="8" fill="#F5A623"/>
        <rect x="1" y="0" width="6" height="2" fill="#17140F"/>
        <rect x="0" y="1" width="1" height="2" fill="#17140F"/>
        <rect x="7" y="1" width="1" height="2" fill="#17140F"/>
        <rect x="2" y="3" width="1" height="1" fill="#17140F"/>
        <rect x="5" y="3" width="1" height="1" fill="#17140F"/>
        <rect x="1" y="4" width="1" height="1" fill="#FF6DAE"/>
        <rect x="6" y="4" width="1" height="1" fill="#FF6DAE"/>
        <rect x="3" y="5" width="2" height="1" fill="#17140F"/>
        <rect x="6" y="6" width="2" height="2" fill="none" stroke="#17140F" stroke-width="1"/>
      </symbol>
    </defs></svg>

    <div class="statusbar">
      <div class="time">9:41</div>
      <div class="sys">
        <svg width="19" height="12" viewBox="0 0 19 12"><g fill="#17140F"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5.5" width="3" height="6.5"/><rect x="10" y="3" width="3" height="9"/><rect x="15" y="0.5" width="3" height="11.5"/></g></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><g fill="#17140F"><path d="M8.5 2.2c2.9 0 5.6 1.1 7.6 3l-1.5 1.6A8.6 8.6 0 0 0 8.5 4.3 8.6 8.6 0 0 0 2.4 6.8L.9 5.2A11 11 0 0 1 8.5 2.2z"/><path d="M8.5 6.1c1.7 0 3.3.7 4.5 1.9l-1.6 1.6a4.1 4.1 0 0 0-5.8 0L4 8a6.4 6.4 0 0 1 4.5-1.9z"/><circle cx="8.5" cy="10.4" r="1.6"/></g></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3" fill="none" stroke="#17140F" stroke-width="1.4"/><rect x="2.4" y="2.4" width="15.5" height="8.2" rx="1.5" fill="#17140F"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#17140F"/></svg>
      </div>
    </div>

    <div class="app">

      <div class="head">
        <div class="logo"><svg class="mark"><use href="#px-snake"/></svg><span class="wm">暗号</span></div>
      </div>

      <a class="add-item" href="snake-signal-add.html"><span class="plus">＋</span><span>新增暗号</span></a>

      <section class="simple-section">
        <h2>我的暗号</h2>
        <a class="simple-card" id="ringCard" href="snake-signal-add.html?mode=edit" style="display:none">
          <span class="simple-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17140F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="2.4" fill="#17140F" stroke="none"/><path d="M7.5 13a4.5 4.5 0 0 1 9 0M4.5 13a7.5 7.5 0 0 1 15 0"/></svg></span>
          <span class="simple-copy"><b>双击 <span id="ringName">Ring 01</span></b><small>已连接 · 可用于预案</small></span>
          <span class="arrow">›</span>
        </a>
      </section>
      <div class="saved-note" id="savedNote">✓ 戒指暗号已添加</div>

    </div><!-- /app -->

    <nav class="tabbar">
      <a class="tab" href="snake-conversation-list.html">

        <span>装备</span>
      </a>
    </nav>

  </div></div>

<script>
(function(){
  var ring=document.getElementById('ringCard'),params=new URLSearchParams(location.search);
  if(localStorage.getItem('snake_ring_added')==='1'){
    ring.style.display='flex';document.getElementById('ringName').textContent=localStorage.getItem('snake_ring_name')||'Ring 01';
  }
  if(params.get('added')==='ring'){
    ring.classList.add('just-added');var note=document.getElementById('savedNote');note.style.display='block';
    setTimeout(function(){note.style.display='none';history.replaceState({},'',location.pathname);},1800);
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBCF4B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />

<title>SNAKE1 · 对话</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FCF3D6;--sun:#FBCF4B;--pink:#FF6DAE;--pink2:#FF4E9A;
    --ink:#17140F;--card:#FFFEFA;--mut:#8A8475;--live:#3E9E5A;
    --disp:'Archivo Black','Noto Sans SC','PingFang SC',sans-serif;
    --ui:'Archivo','Noto Sans SC','PingFang SC',sans-serif;
    --mono:'Space Mono',ui-monospace,'PingFang SC','Noto Sans SC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#2a2622;background-image:radial-gradient(circle at 1px 1px,rgba(251,207,75,.16) 1px,transparent 0);background-size:24px 24px;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:26px;font-family:var(--ui);overflow:hidden}
  .phone{position:relative;width:390px;height:844px;flex:0 0 auto;background:var(--ink);border-radius:46px;padding:9px;box-shadow:0 0 0 2px #34302a,0 30px 60px rgba(0,0,0,.6),14px 14px 0 rgba(255,109,174,.32)}
  .screen{position:relative;width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}
  .statusbar{height:46px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-family:var(--mono);font-weight:700;color:var(--ink)}
  .statusbar .time{font-size:15px;letter-spacing:.5px}.statusbar .sys{display:flex;align-items:center;gap:7px}.statusbar svg{display:block}
  .app{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:76px}.app::-webkit-scrollbar{display:none}
  .head{background:var(--sun);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:10px;padding:12px 18px 13px}
  .head .mark{width:28px;height:28px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);transform:rotate(-4deg)}
  .head h1{font-family:var(--disp);font-size:24px;letter-spacing:-.7px;line-height:1;color:var(--ink)}
  .new-conversation{margin:20px 18px 24px;height:60px;background:var(--pink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);text-decoration:none;font-size:16px;font-weight:900;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none)}
  .new-conversation:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
  .new-conversation .plus{font-family:var(--disp);font-size:23px;line-height:1}
  .section{padding:0 18px 18px}.section-title{margin-bottom:10px;font-size:14px;font-weight:900}
  .sessions{display:flex;flex-direction:column;gap:11px}.session{display:flex;gap:11px;padding:12px;background:var(--card);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);color:var(--ink);text-decoration:none;transition:transform .07s steps(2,jump-none),box-shadow .07s steps(2,jump-none)}
  .session:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.session.unread{box-shadow:4px 4px 0 var(--pink)}
  .sc{flex:1;min-width:0}.top{display:flex;align-items:center;gap:7px}.top b{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top time{margin-left:auto;flex:0 0 auto;font:700 8.5px var(--mono);color:var(--mut)}
  .preview{font-size:11px;font-weight:600;line-height:1.4;color:#5a5347;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.go{font-family:var(--disp);font-size:18px;align-self:center}
  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:7;height:64px;display:flex;align-items:stretch;background:var(--card);border-top:3px solid var(--ink)}
  .tab{flex:1;position:relative;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#a49c88;border-right:2px solid #ece2c4;font:700 9.5px var(--mono);letter-spacing:1px;padding-bottom:3px;transition:transform .06s steps(2,jump-none)}
  .tab:last-child{border-right:0}.tab .g{width:22px;height:22px;display:block}.tab:active{transform:translateY(2px)}.tab.active{background:var(--sun);color:var(--ink)}.tab.active::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--pink)}
</style>
</head>
<body>
  <div class="phone"><div class="screen">

    <div class="statusbar"><div class="time">9:41</div><div class="sys">
      <svg width="19" height="12" viewBox="0 0 19 12"><g fill="#17140F"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5.5" width="3" height="6.5"/><rect x="10" y="3" width="3" height="9"/><rect x="15" y=".5" width="3" height="11.5"/></g></svg>
      <svg width="17" height="12" viewBox="0 0 17 12"><g fill="#17140F"><path d="M8.5 2.2c2.9 0 5.6 1.1 7.6 3l-1.5 1.6A8.6 8.6 0 0 0 8.5 4.3 8.6 8.6 0 0 0 2.4 6.8L.9 5.2A11 11 0 0 1 8.5 2.2z"/><path d="M8.5 6.1c1.7 0 3.3.7 4.5 1.9l-1.6 1.6a4.1 4.1 0 0 0-5.8 0L4 8a6.4 6.4 0 0 1 4.5-1.9z"/><circle cx="8.5" cy="10.4" r="1.6"/></g></svg>
      <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3" fill="none" stroke="#17140F" stroke-width="1.4"/><rect x="2.4" y="2.4" width="15.5" height="8.2" rx="1.5" fill="#17140F"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#17140F"/></svg>
    </div></div>
    <main class="app">
      <header class="head"><svg class="mark"><use href="#px-snake"/></svg><h1>对话</h1></header>
      <a class="new-conversation" href="snake-conversation.html?sid=new"><span class="plus">＋</span><span>新增对话</span></a>
      <section class="section"><div class="section-title">最近对话</div>
        <div class="sessions">
          <a class="session unread" href="snake-conversation.html?sid=03&amp;m=相亲饭局怕冷场，老是脱不了身"><div class="sc"><div class="top"><b>相亲饭局救急</b><time>刚刚</time></div><div class="preview">继续刚才的对话</div></div><span class="go">→</span></a>
        </div>
      </section>
    </main>
    <nav class="tabbar">
      <a class="tab active" href="snake-conversation-list.html"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 9h8M8 12h5"/></svg><span>对话</span></a>
      <a class="tab" href="snake-plan-list.html"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>预案</span></a>
      <a class="tab" href="snake-chat.html"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V20h-5v-5H9v5H4z"/></svg><span>Snake</span></a>
      <a class="tab" href="snake-signal-config.html"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="13" r="2.4" fill="currentColor" stroke="none"/><path d="M7.5 13a4.5 4.5 0 0 1 9 0M4.5 13a7.5 7.5 0 0 1 15 0"/></svg><span>暗号</span></a>
      <a class="tab" href="snake-tool-config.html"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="4" y="8" width="16" height="11" rx="1.5"/><path d="M9 8V6.5A3 3 0 0 1 15 6.5V8"/></svg><span>装备</span></a>
    </nav>
  </div></div>
</body>
</html>

<style>
:root{--cream:#FCF3D6;--sun:#FBCF4B;--pink:#FF6DAE;--pink2:#FF4E9A;--ink:#17140F;--card:#FFFEFA;--mut:#8A8475;--live:#3E9E5A;--coral:#FF7A45;--disp:'Archivo Black','Noto Sans SC','PingFang SC',sans-serif;--ui:'Archivo','Noto Sans SC','PingFang SC',sans-serif;--mono:'Space Mono','PingFang SC',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#2a2622;background-image:radial-gradient(circle at 1px 1px,rgba(251,207,75,.16) 1px,transparent 0);background-size:24px 24px;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:26px;font-family:var(--ui);overflow:hidden}.phone{position:relative;width:390px;height:844px;flex:0 0 auto;background:var(--ink);border-radius:46px;padding:9px;box-shadow:0 0 0 2px #34302a,0 30px 60px rgba(0,0,0,.6),14px 14px 0 rgba(255,109,174,.32)}.screen{position:relative;width:100%;height:100%;background:var(--cream);border-radius:38px;overflow:hidden;display:flex;flex-direction:column}.statusbar{height:46px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font:700 15px var(--mono);color:var(--ink)}.sys{display:flex;align-items:center;gap:7px}.head{background:var(--sun);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:11px;padding:9px 14px 10px;flex:0 0 auto}.back{width:34px;height:34px;flex:0 0 auto;background:var(--card);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none}.htxt{flex:1;min-width:0}.htxt b{font:16px/1 var(--disp);letter-spacing:-.4px;color:var(--ink);display:block}.htxt small{font:700 9px var(--mono);color:var(--ink);display:flex;align-items:center;gap:5px;margin-top:3px}.htxt small .d{width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.1s steps(2,jump-none) infinite}@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.25}}.thread{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px 10px;display:flex;flex-direction:column;gap:12px}.thread::-webkit-scrollbar{display:none}.msg{display:flex;gap:9px;max-width:100%;opacity:0;transform:translateY(8px);animation:rise .25s steps(3,jump-none) forwards}@keyframes rise{to{opacity:1;transform:none}}.msg .av{width:30px;height:30px;flex:0 0 auto;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);image-rendering:pixelated;align-self:flex-end;object-fit:cover}.bub{border:2.5px solid var(--ink);padding:10px 12px;font:600 13px/1.55 var(--ui);color:var(--ink);max-width:250px}.msg.s .bub{background:var(--card);box-shadow:3px 3px 0 var(--ink);border-top-left-radius:0}.msg.u{flex-direction:row-reverse;margin-left:auto}.msg.u .bub{background:var(--pink);box-shadow:3px 3px 0 var(--ink);border-top-right-radius:0}.msg.u .av{background:var(--sun)}.typing{display:flex;gap:5px;align-items:center;padding:12px}.typing i{width:8px;height:8px;background:var(--mut);border-radius:50%;animation:tp 1s steps(2,jump-none) infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes tp{0%,60%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}.echo{background:var(--cream)!important;border-style:dashed!important}.echo .et{font:700 9px var(--mono);letter-spacing:1px;color:var(--pink2);margin-bottom:6px}.echo .er{display:flex;gap:6px;font-size:12px;color:#3a352c;line-height:1.5;margin-top:4px}.echo .er .k{color:var(--pink2);font-weight:900;flex:0 0 auto}.capcard{background:var(--card);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--pink);padding:10px;max-width:250px}.capcard .ct{font:700 9px var(--mono);letter-spacing:1px;color:var(--pink2);margin-bottom:8px}.caps{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cap{background:var(--cream);border:2px solid var(--ink);padding:8px}.cap small{display:block;font:700 8px var(--mono);color:var(--mut)}.cap b{display:block;margin-top:3px;font-size:11px}.loop-card{width:270px;background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--pink);overflow:hidden}.loop-head{background:var(--ink);color:var(--sun);padding:9px 10px;font:700 9px var(--mono);letter-spacing:1px}.loop-title{padding:10px 11px 2px;font:18px var(--disp)}.loop-sub{padding:0 11px 7px;color:#5a5347;font-size:10px;font-weight:700}.nodes{padding:1px 10px 10px}.node{position:relative;display:flex;gap:8px;align-items:center;background:var(--cream);border:2px solid var(--ink);padding:7px;margin-top:11px;opacity:0;transform:translateX(12px)}.node.in{animation:nodein .3s steps(3,jump-none) forwards}@keyframes nodein{to{opacity:1;transform:none}}.node:not(:first-child)::before{content:'';position:absolute;width:3px;height:11px;background:var(--pink);left:17px;top:-13px}.node-no{width:18px;height:18px;flex:0 0 auto;background:var(--ink);color:var(--sun);display:flex;align-items:center;justify-content:center;font:9px var(--disp)}.node-copy b{display:block;font-size:11px}.node-copy small{display:block;margin-top:1px;color:#5a5347;font-size:9px;font-weight:700}.done{width:250px;background:var(--pink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:13px}.done .check{width:32px;height:32px;background:var(--live);color:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px}.done h3{font:18px var(--disp);margin-top:9px}.done p{font-size:11px;font-weight:700;margin-top:5px;line-height:1.5}.view{display:flex;margin-top:11px;height:42px;align-items:center;justify-content:center;background:var(--card);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none;font-size:12px;font-weight:900}.composer{flex:0 0 auto;border-top:3px solid var(--ink);background:var(--card);padding:9px 12px 12px}.inrow{display:flex;align-items:center;gap:9px}.inrow input{flex:1;min-width:0;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);outline:0;background:var(--card);font:600 13px var(--ui);color:var(--ink);padding:10px 11px}.send{width:42px;height:42px;flex:0 0 auto;background:var(--pink);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}.send:active{transform:translate(2px,2px);box-shadow:none}.send[aria-disabled="true"]{opacity:.35;pointer-events:none}
</style>

<body><div class="phone"><div class="screen">
<div class="statusbar"><span>9:41</span><span class="sys"><svg width="19" height="12" viewBox="0 0 19 12"><g fill="#17140F"><rect y="8" width="3" height="4"/><rect x="5" y="5.5" width="3" height="6.5"/><rect x="10" y="3" width="3" height="9"/><rect x="15" y=".5" width="3" height="11.5"/></g></svg><svg width="17" height="12" viewBox="0 0 17 12"><path fill="#17140F" d="M8.5 2.2c2.9 0 5.6 1.1 7.6 3l-1.5 1.6A8.6 8.6 0 0 0 2.4 6.8L.9 5.2a11 11 0 0 1 7.6-3zm0 3.9c1.7 0 3.3.7 4.5 1.9l-1.6 1.6a4.1 4.1 0 0 0-5.8 0L4 8a6.4 6.4 0 0 1 4.5-1.9zm0 2.7a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2z"/></svg><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3" fill="none" stroke="#17140F" stroke-width="1.4"/><rect x="2.4" y="2.4" width="15.5" height="8.2" rx="1.5" fill="#17140F"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#17140F"/></svg></span></div>
<header class="head"><a class="back" id="back" href="snake-chat.html" aria-label="返回"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m15 5-7 7 7 7"/></svg></a><div class="htxt"><b>新对话</b><small id="status"><span class="d"></span>在线 · 正在帮你想办法</small></div></header>
<main class="thread" id="thread"></main>
<footer class="composer"><div class="inrow"><input id="input" aria-label="继续和 Snake 说" placeholder="继续和 Snake 说…"/><button class="send" id="send" aria-label="发送"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17140F" stroke-width="2.4"><path d="M4 12 20 4l-6 16-3-6-7-2Z"/></svg></button></div></footer>
</div></div>
<script>
(function(){
var flow=new URLSearchParams(location.search).get('flow')==='icebreak'?'icebreak':'exit',auto=new URLSearchParams(location.search).get('start')==='1';
var thread=document.getElementById('thread'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status'),step=0,busy=false;
var flows={
exit:{back:'snake-chat.html',title:'体面离场',desc:'一通恰到好处的电话，帮你自然结束社交场景',prompts:[
'跟别人社交的时候，有时候聊不下去了，但又不知道怎么体面开溜',
'对，饭局、相亲和陌生人社交时我都需要',
'我觉得来个电话最自然',
'就双击 Ring 01 触发',
'让它扮演我妈给我打电话',
'就说家里有急事，让我马上回去',
'如果没接到，20 秒后再打一次',
'确认，创建体面离场预案'],
replies:[
{text:'我理解了。你真正需要的不是“逃跑”，而是一个不伤害关系、又能自然结束对话的离场台阶。除了聊不下去，饭局、相亲和陌生人社交冷场时，也可能需要同一个解法。你希望把这些情况都覆盖进去吗？',card:'abstract'},
{text:'好，那我把它抽象成“体面离场”。我们先确认助攻方式：消息提醒比较轻，电话更像一个真实的离场理由。你更偏向哪一种？'},
{text:'电话最自然，我也同意。我检查了你现在拥有的能力：暗号里有 Ring 01，装备里有电话。下一步要确认，什么动作代表你真的需要我介入？',card:'exitCaps'},
{text:'收到，双击戒指就是明确求助。为了让来电看起来真实，我还需要确认来电身份。可以是妈妈、室友、同事或者公司，你希望我扮演谁？'},
{text:'好，来电显示为“妈妈”。接通后我不会替你自由发挥，只会播放你确认过的话。你希望妈妈具体说什么？'},
{text:'明白，话术是“家里有急事，让我马上回去”。最后确认一个兜底：如果第一次没有接到电话，是结束预案，还是隔一会儿再打一次？'},
{text:'好的，第一次未接听后等待 20 秒再重试一次，第二次仍未接听就停止，不继续打扰。信息已经齐了，我现在把它编排成一个可触发的 Loop。',loop:true}
],nodes:[['收到暗号','双击 Ring 01'],['确认场景','识别是否处于社交时刻'],['拨打电话','来电身份：妈妈'],['播放话术','家里有急事，马上回去'],['失败重试','未接听则 20 秒后再打一次']]},
icebreak:{back:'snake-plan-list.html',title:'社交破冰',desc:'让机器狗替你迈出社交第一步',prompts:[
'我搭讪时不方便破冰，想让机器狗帮我',
'对，搭讪、活动认识新人和社交开场都能用',
'用敲三下 Ring 01 来触发',
'让机器狗过去做友好动作',
'然后展示我的联系方式，但不要替我说话',
'确认，创建社交破冰预案'],
replies:[
{text:'我理解了。你需要的不是一段固定开场白，而是一个低压力的共同话题。除了搭讪，活动认识新人和其他社交开场，也可以复用这个方法。要一起覆盖吗？',card:'iceAbstract'},
{text:'好，我把它抽象成“社交破冰”。我看到你有 Ring 01 和机器狗。先确认触发方式：什么动作代表你希望机器狗介入？',card:'iceCaps'},
{text:'收到，连续敲三下戒指才会触发，避免误操作。接下来确认机器狗靠近后要做什么：友好示意、展示信息，还是播放一句开场白？'},
{text:'可以。机器狗会摇尾、点头并停在安全距离，不会直接碰触对方。它完成示好以后，还需要展示什么信息吗？'},
{text:'明白，只展示你的联系方式，不替你说话，也不主动保存对方信息。我现在把这些约束编排进 Loop。',loop:true}
],nodes:[['收到暗号','连续敲击 Ring 01 三次'],['确认距离','目标在安全接近范围'],['友好靠近','摇尾并点头示好'],['展示信息','仅展示你的联系方式'],['完成返回','机器狗回到用户身边']]}}
var cfg=flows[flow];document.getElementById('back').href=cfg.back;
function setStatus(text,typing){status.innerHTML='<span class="d"></span>'+text;if(typing)status.querySelector('.d').style.background='var(--pink2)'}
function scroll(){requestAnimationFrame(function(){thread.scrollTop=thread.scrollHeight})}
function avatar(){return '<img class="av" src="snake/snake_cut.png" alt="">'}
function addUser(text){var m=document.createElement('div');m.className='msg u';m.innerHTML=avatar()+'<div class="bub"></div>';m.querySelector('.bub').textContent=text;thread.appendChild(m);scroll()}
function typingBubble(){var m=document.createElement('div');m.className='msg s';m.innerHTML=avatar()+'<div class="bub typing"><i></i><i></i><i></i></div>';thread.appendChild(m);scroll();return m}
function streamSnake(text,done){busy=true;send.setAttribute('aria-disabled','true');setStatus('Snake 正在输入…',true);var wait=typingBubble();setTimeout(function(){wait.remove();var m=document.createElement('div');m.className='msg s';m.innerHTML=avatar()+'<div class="bub"></div>';var b=m.querySelector('.bub'),i=0;thread.appendChild(m);function tick(){b.textContent=text.slice(0,i++);scroll();if(i<=text.length){setTimeout(tick,18)}else{setStatus('在线 · 正在帮你想办法');busy=false;done&&done()}}tick()},420)}
function addCard(kind){var m=document.createElement('div');m.className='msg s';var html='';if(kind==='abstract')html='<div class="bub echo"><div class="et">Snake 的理解</div><div class="er"><span class="k">核心</span>需要一个不伤害关系的离场台阶</div><div class="er"><span class="k">场景</span>饭局、相亲、陌生人社交</div><div class="er"><span class="k">目标</span>自然结束，而不是直接拒绝</div></div>';if(kind==='iceAbstract')html='<div class="bub echo"><div class="et">Snake 的理解</div><div class="er"><span class="k">核心</span>用低压力动作创造共同话题</div><div class="er"><span class="k">场景</span>搭讪、活动、社交开场</div><div class="er"><span class="k">边界</span>不替用户过度表达</div></div>';if(kind==='exitCaps')html='<div class="capcard"><div class="ct">已找到可用能力</div><div class="caps"><div class="cap"><small>暗号</small><b>Ring 01</b></div><div class="cap"><small>装备</small><b>电话</b></div></div></div>';if(kind==='iceCaps')html='<div class="capcard"><div class="ct">已找到可用能力</div><div class="caps"><div class="cap"><small>暗号</small><b>Ring 01</b></div><div class="cap"><small>装备</small><b>机器狗</b></div></div></div>';m.innerHTML=avatar()+html;thread.appendChild(m);scroll()}
function buildLoop(done){var m=document.createElement('div');m.className='msg s';m.innerHTML=avatar()+'<div class="loop-card"><div class="loop-head">SKILL LOOP · BUILDING</div><div class="loop-title">'+cfg.title+'</div><div class="loop-sub">'+cfg.desc+'</div><div class="nodes"></div></div>';thread.appendChild(m);var nodes=m.querySelector('.nodes'),i=0;setStatus('正在编排 Loop…',true);function add(){if(i>=cfg.nodes.length){m.querySelector('.loop-head').textContent='SKILL LOOP · READY';setStatus('在线 · 等待你确认');done();return}var n=cfg.nodes[i],el=document.createElement('div');el.className='node';el.innerHTML='<span class="node-no">'+(i+1)+'</span><span class="node-copy"><b>'+n[0]+'</b><small>'+n[1]+'</small></span>';nodes.appendChild(el);requestAnimationFrame(function(){el.classList.add('in')});i++;scroll();setTimeout(add,520)}add()}
function finish(){busy=true;send.setAttribute('aria-disabled','true');setStatus('正在保存 Skill…',true);streamSnake('确认收到。我正在保存这个预案，并把 Loop、暗号和装备依赖一起归档。',function(){localStorage.setItem('snake_plan_'+flow,'1');var m=document.createElement('div');m.className='msg s';m.innerHTML=avatar()+'<div class="done"><span class="check">✓</span><h3>'+cfg.title+' 已创建</h3><p>已保存为一个可触发的 Skill，可以在预案中查看完整 Loop。</p><a class="view" href="snake-plan-detail.html?skill='+flow+'">查看预案 →</a></div>';thread.appendChild(m);input.value='';input.placeholder='已完成';input.disabled=true;setStatus('在线 · Skill 创建完成');scroll()})}
function sendNext(){if(busy)return;var text=input.value.trim();if(!text)return;addUser(text);input.value='';if(step===cfg.prompts.length-1){finish();return}var reply=cfg.replies[step];streamSnake(reply.text,function(){if(reply.card)addCard(reply.card);function ready(){step++;input.value=cfg.prompts[step];send.removeAttribute('aria-disabled');input.focus();scroll()}if(reply.loop){busy=true;buildLoop(function(){busy=false;ready()})}else ready()})}
send.addEventListener('click',sendNext);input.addEventListener('keydown',function(e){if(e.key==='Enter')sendNext()});input.value=cfg.prompts[0];
if(auto)setTimeout(sendNext,250);else input.focus();
})();
</script>
</body></html>
